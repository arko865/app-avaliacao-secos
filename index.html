<script id="adaptiveImageCompressionPatch20260505">
/* === COMPRESSÃO ADAPTATIVA DE FOTOS — PATCH AVALIAÇÃO ARKO ===
   Objetivo: garantir que toda foto tirada no app passe por compressão inteligente
   antes de virar base64 no state, sem mexer no fluxo visual ou nos modais.

   Estratégia:
   1) Análise de variância de bordas em thumbnail 200x200 (Laplaciano simplificado)
      → decide se a foto é "rica em detalhe" (etiqueta/close-up) ou "uniforme" (visão geral).
   2) Compressão de duas passadas com alvo de tamanho:
      → 1ª passada com parâmetros calibrados pelo tipo detectado.
      → Se ficou muito leve (<60KB) e era detalhada, afrouxa pra preservar legibilidade.
      → Se ficou muito pesada (>150KB) em qualquer caso, fecha mais a qualidade.
   3) Substitui:
      a) a função normalizeImageFileToDataUrl global (usada em vários handlers).
      b) Adiciona um interceptor 'change' em capture phase para os inputs
         [data-camera-input] que usavam FileReader cru (linhas 1883 e 3137 originais),
         garantindo compressão antes que o handler original grave foto bruta.

   Não altera: layout, modais, draft, sync, persistência, PDF.
   Comportamento percebido: foto sai mais leve. Toast mostra tamanho final.
*/
(function adaptiveImageCompressionPatch(){
  const PATCH_VERSION = '2026-05-05.foto.adaptativa.2';

  // === Alvos de tamanho final ===
  const TARGET_MIN_KB    = 60;
  const TARGET_MAX_KB    = 150;
  const HARD_CEILING_KB  = 220;

  // === Perfis por tipo de foto ===
  const PROFILES = {
    detail:   { side: 1280, quality: 0.72 },  // close-up de etiqueta, preço
    standard: { side: 1024, quality: 0.68 },  // gôndola comum
    wide:     { side: 800,  quality: 0.62 },  // visão geral
    blurry:   { side: 800,  quality: 0.55 }   // foto borrada/escura
  };

  // ====================================================================
  // ANÁLISE DE VARIÂNCIA DE BORDAS (Laplaciano 3x3 simplificado)
  // ====================================================================
  function computeEdgeVariance(source){
    try {
      const probeSize = 200;
      const probeCanvas = document.createElement('canvas');
      probeCanvas.width = probeSize;
      probeCanvas.height = probeSize;
      const probeCtx = probeCanvas.getContext('2d', { alpha: false });
      probeCtx.drawImage(source, 0, 0, probeSize, probeSize);
      const data = probeCtx.getImageData(0, 0, probeSize, probeSize).data;

      const gray = new Float32Array(probeSize * probeSize);
      for (let i = 0, p = 0; i < data.length; i += 4, p++) {
        gray[p] = (data[i] * 0.299 + data[i+1] * 0.587 + data[i+2] * 0.114);
      }

      let sumAbs = 0;
      let count = 0;
      for (let y = 1; y < probeSize - 1; y++) {
        for (let x = 1; x < probeSize - 1; x++) {
          const c = gray[y * probeSize + x];
          const t = gray[(y - 1) * probeSize + x];
          const b = gray[(y + 1) * probeSize + x];
          const l = gray[y * probeSize + (x - 1)];
          const r = gray[y * probeSize + (x + 1)];
          sumAbs += Math.abs(4 * c - t - b - l - r);
          count++;
        }
      }
      return count > 0 ? sumAbs / count : 0;
    } catch (err) {
      try { console.warn('Falha ao analisar variância da foto.', err); } catch(_){}
      return 15;
    }
  }

  function classifyPhoto(edgeVariance){
    if (edgeVariance < 6)  return 'blurry';
    if (edgeVariance > 28) return 'detail';
    if (edgeVariance < 12) return 'wide';
    return 'standard';
  }

  // ====================================================================
  // COMPRESSÃO COM PARÂMETROS DADOS
  // ====================================================================
  function compressWithParams(source, originalW, originalH, side, quality){
    const scale = Math.min(1, side / Math.max(originalW, originalH));
    const w = Math.max(1, Math.round(originalW * scale));
    const h = Math.max(1, Math.round(originalH * scale));
    const canvas = document.createElement('canvas');
    canvas.width = w;
    canvas.height = h;
    const ctx = canvas.getContext('2d', { alpha: false });
    ctx.fillStyle = '#ffffff';
    ctx.fillRect(0, 0, w, h);
    ctx.drawImage(source, 0, 0, w, h);
    return canvas.toDataURL('image/jpeg', quality);
  }

  function dataUrlSizeKb(dataUrl){
    const base64 = String(dataUrl || '').split(',')[1] || '';
    return Math.round((base64.length * 0.75) / 1024);
  }

  // ====================================================================
  // FUNÇÃO PRINCIPAL — compressão adaptativa de duas passadas
  // ====================================================================
  async function compressImageFileAdaptive(file){
    if (!file) return '';

    const readRaw = () => new Promise((resolve) => {
      const reader = new FileReader();
      reader.onload = () => resolve(String(reader.result || ''));
      reader.onerror = () => resolve('');
      reader.readAsDataURL(file);
    });

    try {
      let source = null;
      if ('createImageBitmap' in window) {
        try {
          source = await createImageBitmap(file, { imageOrientation: 'from-image' });
        } catch(e) {
          try { source = await createImageBitmap(file); } catch(_){ source = null; }
        }
      }
      if (!source) {
        const raw = await readRaw();
        source = await new Promise((resolve, reject) => {
          const img = new Image();
          img.onload = () => resolve(img);
          img.onerror = reject;
          img.src = raw;
        });
      }

      const originalW = source.width || source.naturalWidth || 0;
      const originalH = source.height || source.naturalHeight || 0;
      if (!originalW || !originalH) {
        if (source.close) source.close();
        return await readRaw();
      }

      const edgeVar = computeEdgeVariance(source);
      const profileName = classifyPhoto(edgeVar);
      const profile = PROFILES[profileName];

      let dataUrl = compressWithParams(source, originalW, originalH, profile.side, profile.quality);
      let kb = dataUrlSizeKb(dataUrl);
      let pass = 1;

      // Ajuste fino se ficou fora dos alvos
      if (kb > HARD_CEILING_KB) {
        dataUrl = compressWithParams(source, originalW, originalH, Math.min(profile.side, 1024), 0.55);
        kb = dataUrlSizeKb(dataUrl);
        pass = 2;
      } else if (kb > TARGET_MAX_KB && profileName !== 'detail') {
        dataUrl = compressWithParams(source, originalW, originalH, profile.side, Math.max(0.55, profile.quality - 0.1));
        kb = dataUrlSizeKb(dataUrl);
        pass = 2;
      } else if (kb < TARGET_MIN_KB && profileName === 'detail') {
        const relaxed = compressWithParams(source, originalW, originalH, profile.side, Math.min(0.82, profile.quality + 0.08));
        const relaxedKb = dataUrlSizeKb(relaxed);
        if (relaxedKb <= HARD_CEILING_KB) {
          dataUrl = relaxed;
          kb = relaxedKb;
          pass = 2;
        }
      }

      if (source.close) source.close();

      // Feedback discreto
      try {
        const labels = { detail: 'detalhe', standard: 'padrão', wide: 'visão ampla', blurry: 'baixa nitidez' };
        if (typeof showToast === 'function') {
          showToast(`Foto otimizada (${labels[profileName] || 'padrão'}, ${kb} KB).`);
        }
      } catch(_){}

      // Telemetria local (últimos 50 registros)
      try {
        const log = JSON.parse(localStorage.getItem('arko_foto_compressao_log_v1') || '[]');
        log.push({
          at: new Date().toISOString(),
          edgeVar: Math.round(edgeVar * 10) / 10,
          profile: profileName,
          passes: pass,
          finalKb: kb,
          originalW, originalH
        });
        localStorage.setItem('arko_foto_compressao_log_v1', JSON.stringify(log.slice(-50)));
      } catch(_){}

      return dataUrl;

    } catch (err) {
      try { console.warn('Falha na compressão adaptativa; salvando foto crua.', err); } catch(_){}
      try { if (typeof showToast === 'function') showToast('Não foi possível otimizar a foto; salvando original.'); } catch(_){}
      return await readRaw();
    }
  }

  // ====================================================================
  // SUBSTITUI A FUNÇÃO GLOBAL — cobre os handlers que já a usam
  // ====================================================================
  try {
    window.normalizeImageFileToDataUrl = compressImageFileAdaptive;
    if (typeof normalizeImageFileToDataUrl !== 'undefined') {
      try { normalizeImageFileToDataUrl = compressImageFileAdaptive; } catch(_){}
    }
  } catch(_){}

  // ====================================================================
  // INTERCEPTA HANDLERS QUE LIAM FOTO CRUA VIA FileReader
  // ====================================================================
  // No arquivo original, dois lugares (linhas ~1883 e ~3137) usavam FileReader
  // direto ao invés de normalizeImageFileToDataUrl. Como esses handlers são
  // re-anexados via .onchange = ... a cada renderização do modal, a estratégia
  // mais segura é ouvir 'change' em capture phase no document e processar
  // a foto ANTES do handler .onchange original rodar — limpando input.value
  // pra que o handler original receba files vazio e saia cedo.

  function findRowByCameraInput(input){
    try {
      if (typeof manageStreetCounts === 'undefined' || !Array.isArray(manageStreetCounts)) return null;
      const idx = Number(input.dataset.cameraInput);
      if (!Number.isFinite(idx)) return null;
      return manageStreetCounts[idx] || null;
    } catch(_){ return null; }
  }

  function findDraftForRow(row){
    try {
      if (typeof getDraftPhotoForRow === 'function') return getDraftPhotoForRow(row);
    } catch(_){}
    return null;
  }

  document.addEventListener('change', function(ev){
    const input = ev.target;
    if (!input || !input.matches || !input.matches('input[data-camera-input]')) return;
    const file = input.files && input.files[0];
    if (!file) return;

    const row = findRowByCameraInput(input);
    const draft = findDraftForRow(row);

    // Se não conseguimos descobrir o destino, deixa o handler original rodar
    if (!row || !draft) return;

    // Pegamos o file e zeramos o input ANTES do handler original rodar
    const fileRef = file;
    try { input.value = ''; } catch(_){}

    try { if (typeof showToast === 'function') showToast('Otimizando foto...'); } catch(_){}

    compressImageFileAdaptive(fileRef).then(dataUrl => {
      if (!dataUrl) {
        try { if (typeof showToast === 'function') showToast('Não foi possível processar a foto.'); } catch(_){}
        return;
      }
      draft.dataUrl = dataUrl;
      if (!draft.setor) draft.setor = row.rua || '';

      // Persiste também no temp do modal de campo, se existir
      try { if (typeof saveFieldModalTemp === 'function') saveFieldModalTemp(); } catch(_){}
      try { if (typeof renderStreetCounts === 'function') renderStreetCounts(); } catch(_){}
    }).catch(err => {
      try { console.warn('Falha ao processar foto interceptada.', err); } catch(_){}
    });
  }, true); // capture: true → roda antes dos handlers .onchange = ...

  // ====================================================================
  // FIM
  // ====================================================================
  try { console.info('[Arko] Patch de compressão adaptativa de fotos ativo. Versão:', PATCH_VERSION); } catch(_){}
  window.arkoCompressImage = compressImageFileAdaptive;
})();
</script>
